server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;

        # Only errors nginx itself generates (e.g. upstream connection refused)
        # are rewritten to JSON. Real API responses, including 502 from the game
        # providers, must pass through untouched, so proxy_intercept_errors
        # stays off.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        internal;
        default_type application/json;
        return 502 '{"error":"API is unavailable"}';
    }

    # Without this, a bare /api request falls through to the SPA fallback and
    # the client receives index.html instead of JSON.
    location = /api {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
